<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINOTEKA — плеер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background: #000;
            color: #ddd;
            font-family: "Nunito", "Segoe UI", sans-serif;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
        }

        /* Панель выбора поверх видео: видна, пока двигают мышью или на паузе */
        .controls {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 10px 12px 24px;
            background: linear-gradient(rgba(0, 0, 0, 0.75), transparent);
            opacity: 1;
            transition: opacity 0.4s ease;
            font-size: 13px;
        }

        body.idle .controls {
            opacity: 0;
            pointer-events: none;
        }

        select {
            background: rgba(30, 30, 30, 0.9);
            color: #ddd;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 5px 8px;
            font: inherit;
            max-width: 240px;
        }

        .badge {
            margin-left: auto;
            color: #888;
            font-size: 12px;
        }

        .message {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            color: #aaa;
            font-size: 15px;
            line-height: 1.5;
            pointer-events: none;
        }

        .message[hidden] {
            display: none;
        }
    </style>
</head>
<body>
    <video id="video" controls autoplay playsinline></video>
    <div class="controls" id="controls">
        <select id="voice" title="Озвучка"></select>
        <select id="season" title="Сезон" hidden></select>
        <select id="episode" title="Серия" hidden></select>
        <select id="quality" title="Качество"></select>
        <span class="badge">CDNVideoHub · без рекламы</span>
    </div>
    <div class="message" id="message">Загрузка…</div>
    <script src="play.js"></script>
</body>
</html>
