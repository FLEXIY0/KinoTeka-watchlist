name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test

  # Проверяет команду установки ровно так, как её запускает пользователь:
  # irm https://raw.githubusercontent.com/.../install.ps1 | iex
  # Папка установки — с кириллицей и пробелом, как у C:\Users\Иван Петров
  # (имя собирается из кодов символов: Windows PowerShell 5.1 читает скрипт
  # шага не в UTF-8, и кириллица прямо в нём превратилась бы в мусор)
  install-windows:
    name: install.ps1 / ${{ matrix.shell }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      KINOTEKA_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      KINOTEKA_SKIP_MPV: '1'
    steps:
      - name: Первая установка (без системного Node — качается портативный)
        run: |
          $env:KINOTEKA_HOME = Join-Path $env:RUNNER_TEMP ((-join [char[]](0x041A,0x0438,0x043D,0x043E,0x0442,0x0435,0x043A,0x0430)) + ' Test')
          $env:KINOTEKA_NO_START = '1'
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'node.exe')) }) -join ';'
          if (Get-Command node -ErrorAction SilentlyContinue) { throw 'system node is still on PATH' }

          irm "https://raw.githubusercontent.com/${{ github.repository }}/$env:KINOTEKA_REF/install.ps1" | iex

          foreach ($p in 'node\node.exe', 'app\server.js', 'app\node_modules\express', 'app\node_modules\figlet', 'app\.kinoteka-version', 'bin\ktw.cmd') {
            if (-not (Test-Path (Join-Path $env:KINOTEKA_HOME $p))) { throw "missing $p" }
          }
          if (Test-Path (Join-Path $env:KINOTEKA_HOME 'app\assets\images\demo.gif')) { throw 'demo.gif should not be downloaded' }

          $userPath = (Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if (($userPath -split ';')[0] -ne (Join-Path $env:KINOTEKA_HOME 'bin')) { throw "bin is not first in user PATH: $userPath" }

      - name: Команда ktw работает
        run: |
          $env:KINOTEKA_HOME = Join-Path $env:RUNNER_TEMP ((-join [char[]](0x041A,0x0438,0x043D,0x043E,0x0442,0x0435,0x043A,0x0430)) + ' Test')
          $ktw = Join-Path $env:KINOTEKA_HOME 'bin\ktw.cmd'
          $help = & $ktw help | Out-String
          if ($help -notmatch 'ktw watch') { throw "unexpected help: $help" }
          # Windows PowerShell 5.1 при Stop считает любой stderr внешней программы ошибкой
          $ErrorActionPreference = 'Continue'
          $version = & $ktw --version 2>&1 | Out-String
          if ($version -notmatch $env:KINOTEKA_REF.Substring(0, 7)) { throw "unexpected version: $version" }
          Write-Host $version

      - name: Повторный запуск (уже установлено)
        run: |
          $env:KINOTEKA_HOME = Join-Path $env:RUNNER_TEMP ((-join [char[]](0x041A,0x0438,0x043D,0x043E,0x0442,0x0435,0x043A,0x0430)) + ' Test')
          $env:KINOTEKA_NO_START = '1'
          irm "https://raw.githubusercontent.com/${{ github.repository }}/$env:KINOTEKA_REF/install.ps1" | iex

      - name: Обновление, когда GitHub API не отвечает (лимит запросов)
        run: |
          $env:KINOTEKA_HOME = Join-Path $env:RUNNER_TEMP ((-join [char[]](0x041A,0x0438,0x043D,0x043E,0x0442,0x0435,0x043A,0x0430)) + ' Test')
          $env:KINOTEKA_NO_START = '1'
          $env:KINOTEKA_GITHUB_API = 'http://127.0.0.1:9'
          Remove-Item (Join-Path $env:KINOTEKA_HOME 'app\.kinoteka-version')
          irm "https://raw.githubusercontent.com/${{ github.repository }}/$env:KINOTEKA_REF/install.ps1" | iex
          $version = (Get-Content (Join-Path $env:KINOTEKA_HOME 'app\.kinoteka-version') -Raw).Trim()
          if ($version -ne $env:KINOTEKA_REF) { throw "app was not re-downloaded: $version" }

      - name: Запуск коллекции командой ktw
        run: |
          $env:KINOTEKA_HOME = Join-Path $env:RUNNER_TEMP ((-join [char[]](0x041A,0x0438,0x043D,0x043E,0x0442,0x0435,0x043A,0x0430)) + ' Test')
          $ktw = Join-Path $env:KINOTEKA_HOME 'bin\ktw.cmd'
          $proc = Start-Process -FilePath $ktw -PassThru

          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $films = Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/films' -UseBasicParsing
                $ok = $true
                break
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw 'server did not start' }

            $page = Invoke-WebRequest -Uri 'http://127.0.0.1:3000/' -UseBasicParsing
            if ($page.StatusCode -ne 200) { throw "index returned $($page.StatusCode)" }

            $film = Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/films' -Method Post -ContentType 'application/json' -Body '{"title":"Test"}'
            $dataFile = Join-Path $env:KINOTEKA_HOME "data\films_and_serials\$($film.id)\data.json"
            if (-not (Test-Path -LiteralPath $dataFile)) { throw "film was not saved to data dir: $dataFile" }
            Write-Host "OK: film $($film.id) saved to $dataFile"
          } finally {
            taskkill /PID $proc.Id /T /F | Out-Null
          }

  # То же для Linux и macOS: curl -fsSL .../install.sh | sh
  # Папка установки — с кириллицей и пробелом
  install-unix:
    name: install.sh / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      KINOTEKA_REF: ${{ github.event.pull_request.head.sha || github.sha }}
      KINOTEKA_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.pull_request.head.sha || github.sha }}/
      KINOTEKA_SKIP_MPV: '1'
    steps:
      - name: Первая установка (портативный Node)
        run: |
          # runner.temp недоступен в env задачи — задаём пути здесь
          export KINOTEKA_HOME="$RUNNER_TEMP/Кинотека Test" KINOTEKA_BIN="$RUNNER_TEMP/bin"
          printf 'KINOTEKA_HOME=%s\nKINOTEKA_BIN=%s\n' "$KINOTEKA_HOME" "$KINOTEKA_BIN" >> "$GITHUB_ENV"
          curl -fsSL "${KINOTEKA_RAW_BASE}install.sh" | KINOTEKA_NO_START=1 KINOTEKA_PORTABLE_NODE=1 sh
          for p in node/bin/node app/server.js app/node_modules/express app/node_modules/figlet app/.kinoteka-version; do
            test -e "$KINOTEKA_HOME/$p" || { echo "missing $p"; exit 1; }
          done
          test -x "$KINOTEKA_BIN/ktw" || { echo 'missing ktw'; exit 1; }
          test ! -e "$KINOTEKA_HOME/app/assets/images/demo.gif" || { echo 'demo.gif should not be downloaded'; exit 1; }
          grep -q "$KINOTEKA_BIN" ~/.profile || { echo 'PATH was not added to ~/.profile'; exit 1; }

      - name: Команда ktw работает
        run: |
          "$KINOTEKA_BIN/ktw" help | grep -q 'ktw watch'
          "$KINOTEKA_BIN/ktw" --version 2>&1 | tee /dev/stderr | grep -q "$(printf '%s' "$KINOTEKA_REF" | cut -c1-7)"

      - name: Обновление командой ktw update (GitHub API не отвечает)
        run: |
          rm "$KINOTEKA_HOME/app/.kinoteka-version"
          KINOTEKA_GITHUB_API=http://127.0.0.1:9 "$KINOTEKA_BIN/ktw" update
          test "$(cat "$KINOTEKA_HOME/app/.kinoteka-version")" = "$KINOTEKA_REF" || { echo 'app was not re-downloaded'; exit 1; }

      - name: Запуск коллекции командой ktw
        run: |
          "$KINOTEKA_BIN/ktw" < /dev/null > ktw.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/films > /dev/null && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:3000/ || { cat ktw.log; exit 1; }
          id=$(curl -sf -X POST -H 'Content-Type: application/json' -d '{"title":"Test"}' http://127.0.0.1:3000/api/films | sed 's/.*"id":"\{0,1\}\([^",}]*\).*/\1/')
          test -f "$KINOTEKA_HOME/data/films_and_serials/$id/data.json" || { echo "film $id was not saved"; cat ktw.log; exit 1; }
          echo "OK: film $id saved"
