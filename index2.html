<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINOTEKA</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="theme-manager.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Quicksand:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@300;400;600;700&family=Lato:wght@300;400;700&family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Nunito", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
            background: var(--bg-primary, #141414);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
            position: relative;
            z-index: 10;
        }

        .tile {
            position: relative;
            width: 80px;
            height: 80px;
            background: var(--bg-secondary, #212121);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            color: var(--text-secondary, #9E9E9E);
        }

        .tile:hover {
            border-color: var(--border-hover, #323232);
            box-shadow: 0 4px 12px rgba(55, 55, 55, 0.3);
            transform: scale(1.05);
            color: var(--text-primary, #B8B8B8);
        }


        .tile-label {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-accent, rgba(62, 62, 62, 0.9));
            color: var(--text-secondary, #9E9E9E);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 10;
        }

        .tile:hover .tile-label {
            opacity: 1;
            visibility: visible;
        }

        /* Иконка на плитке */
        .tile-icon {
            width: 60px;
            height: 60px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }

        /* Три точки для плитки меню */
        .tile:last-child::before {
            content: '•••';
            font-size: 30px;
            font-weight: 400;
            color: inherit;
            line-height: 1;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10%;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 300px;
            height: 100%;
            background: var(--bg-secondary, #212121);
            transform: translateX(-100%);
            transition: transform 0.4s ease-out;
            z-index: 5;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            font-size: 24px;
            font-weight: 400;
            color: var(--text-secondary, #9E9E9E);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color, #323232);
        }

        .sidebar-menu {
            list-style: none;
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .sidebar-menu li {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: var(--bg-accent, #3e3e3e);
            color: var(--text-secondary, #9E9E9E);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-menu li:hover {
            background: var(--bg-hover, #323232);
            color: var(--text-primary, #B8B8B8);
        }

        .category-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sidebar-menu li:hover .category-actions {
            opacity: 1;
        }

        .edit-btn, .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary, #9E9E9E);
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .edit-btn {
            font-size: 18px;
        }

        .edit-btn .material-symbols-outlined {
            font-size: 18px;
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 20;
        }

        .edit-btn:hover {
            color: var(--star-filled, #ffcc80);
        }

        .delete-btn {
            font-size: 18px;
        }

        .delete-btn:hover {
            color: var(--star-filled, #ff6b6b);
        }

        /* Кнопка добавления в сайдбаре */
        .add-btn-container {
            padding: 0 15px 15px 15px;
            position: relative;
        }

        .sidebar-add-btn {
            width: 100%;
            height: 50px;
            background: var(--bg-tertiary, #2a2a2a);
            border: 2px solid var(--border-color, #3e3e3e);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-add-btn::before {
            content: '+';
            font-size: 32px;
            font-weight: 300;
            color: var(--text-muted, #666);
            position: relative;
            z-index: 2;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-add-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 157, 0, 0.15) 0%, transparent 70%);
            opacity: 0;
            transform: scale(0);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-add-btn:hover {
            background: var(--bg-accent, #3e3e3e);
            border-color: var(--star-filled, #ffcc80);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 157, 0, 0.25);
        }

        .sidebar-add-btn:hover::before {
            color: var(--star-filled, #ffcc80);
            transform: rotate(90deg) scale(1.1);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .sidebar-add-btn:hover::after {
            opacity: 1;
            transform: scale(1);
            animation: ripple 1.5s ease-out infinite;
        }

        .sidebar-add-btn:active {
            transform: translateY(0) scale(0.98);
        }

        @keyframes pulse {
            0%, 100% {
                transform: rotate(90deg) scale(1.1);
            }
            50% {
                transform: rotate(90deg) scale(1.2);
            }
        }

        @keyframes ripple {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.4;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        /* Модальное окно подтверждения удаления */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-primary, #1a1a1a);
            border: 1px solid #3e3e3e;
            padding: 30px;
            border-radius: 16px;
            width: 350px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 15px;
            font-weight: 400;
            color: var(--text-secondary, #9E9E9E);
            margin-bottom: 25px;
            line-height: 1.5;
            letter-spacing: 0.3px;
        }

        .error-message {
            color: #ff6b6b;
            font-size: 13px;
            margin-top: -10px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 400;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .modal-buttons .confirm-btn {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            color: #fff;
            border: none;
        }

        .modal-buttons .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 68, 68, 0.4);
        }

        .modal-buttons .cancel-btn {
            background: transparent;
            color: var(--text-secondary, #9E9E9E);
            border: 2px solid var(--border-color, #3e3e3e);
        }

        .modal-buttons .cancel-btn:hover {
            border-color: var(--border-hover, #555);
            background: var(--bg-tertiary, #2a2a2a);
            color: var(--text-primary, #B8B8B8);
        }

        /* Минималистичное модальное окно */
        .input-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-modal.active {
            opacity: 1;
            visibility: visible;
        }

        .input-modal-content {
            background: var(--bg-primary, #1a1a1a);
            border: 1px solid #3e3e3e;
            padding: 30px;
            border-radius: 16px;
            width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-modal.active .input-modal-content {
            transform: scale(1);
        }

        .input-modal-title {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary, #9E9E9E);
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            border: 2px solid var(--border-color, #2a2a2a);
            background: var(--bg-primary, #0f0f0f);
            color: var(--text-primary, #fff);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--star-filled, #ffcc80);
            background: var(--bg-primary, #141414);
        }

        .input-field::placeholder {
            color: var(--text-muted, #555);
        }

        .input-field:disabled {
            background: var(--bg-primary, #1a1a1a);
            color: var(--text-muted, #666);
            cursor: not-allowed;
            border-color: var(--border-color, #2a2a2a);
        }

        .input-modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .input-modal-buttons .modal-btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .input-modal-buttons .confirm-btn {
            background: linear-gradient(135deg, #ffcc80 0%, #ff8800 100%);
            color: #000;
            border: none;
        }

        .input-modal-buttons .confirm-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 157, 0, 0.4);
        }

        .input-modal-buttons .cancel-btn {
            background: transparent;
            color: var(--text-secondary, #9E9E9E);
            border: 2px solid var(--border-color, #3e3e3e);
        }

        .input-modal-buttons .cancel-btn:hover {
            border-color: var(--border-hover, #555);
            background: var(--bg-tertiary, #2a2a2a);
            color: var(--text-primary, #B8B8B8);
        }

        /* Кнопка назад */
        .back-button-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 5;
        }

        .back-button {
            width: 50px;
            height: 50px;
            background: var(--bg-accent, #3e3e3e);
            border: none;
            border-radius: 8px;
            color: var(--text-secondary, #9E9E9E);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: var(--bg-hover, #323232);
            color: var(--text-primary, #B8B8B8);
        }

        .back-button .material-symbols-outlined {
            font-size: 24px;
            font-variation-settings:
                'FILL' 1,
                'wght' 600,
                'GRAD' 0,
                'opsz' 24;
        }

        /* Секция загрузки изображений */
        .upload-section {
            margin: 20px 0;
        }

        .upload-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary, #9E9E9E);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .upload-preview {
            width: 100%;
            height: 120px;
            background: var(--bg-tertiary, #2a2a2a);
            border: 2px dashed var(--border-color, #3e3e3e);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            overflow: hidden;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .upload-preview.icon-preview {
            height: 80px;
        }

        .upload-preview.has-image {
            border-style: solid;
            border-color: var(--star-filled, #ffcc80);
        }

        .upload-placeholder {
            color: var(--text-muted, #555);
            font-size: 13px;
            pointer-events: none;
        }

        .upload-preview.has-image .upload-placeholder {
            display: none;
        }

        .upload-btn {
            width: 100%;
            padding: 10px;
            background: var(--bg-tertiary, #2a2a2a);
            border: 1px solid var(--border-color, #3e3e3e);
            border-radius: 8px;
            color: var(--text-secondary, #9E9E9E);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-btn:hover {
            background: var(--bg-accent, #3e3e3e);
            border-color: var(--border-hover, #555);
            color: var(--text-primary, #B8B8B8);
        }

        .upload-actions {
            display: flex;
            gap: 10px;
        }

        .upload-actions .upload-btn {
            flex: 1;
        }

        .clear-upload-btn {
            flex: 0 0 auto;
            width: auto;
            padding: 10px 16px;
            background: transparent;
            color: var(--text-secondary, #9E9E9E);
            border: 2px solid var(--border-color, #3e3e3e);
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .clear-upload-btn:hover {
            border-color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
        }

        .clear-upload-btn .material-symbols-outlined {
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            
            .tile {
                width: 60px;
                height: 60px;
            }
            
            .sidebar {
                width: 250px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div class="back-button-container">
        <button class="back-button" onclick="goBack()">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>
    </div>
    
    <div class="container">
        <div class="tile" id="tile1">
            <div class="tile-label">Категория 1</div>
        </div>
        <div class="tile" id="tile2">
            <div class="tile-label">Категория 2</div>
        </div>
        <div class="tile" id="tile3">
            <div class="tile-label">Категория 3</div>
        </div>
        <div class="tile" id="tile4">
            <div class="tile-label">Категория 4</div>
        </div>
        <div class="tile" id="tile5">
            <div class="tile-label">Категория 5</div>
        </div>
        <div class="tile" id="menuButton">
            <div class="tile-label">Меню</div>
        </div>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">Категории</div>
        <ul class="sidebar-menu" id="categoryList">
            <!-- Категории будут добавлены динамически -->
        </ul>
        <div class="add-btn-container">
            <div class="sidebar-add-btn" id="sidebarAddBtn"></div>
        </div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <div class="modal-title">Вы уверены, что хотите удалить эту категорию?</div>
            <div class="modal-buttons">
                <button class="modal-btn cancel-btn" id="cancelDelete">Отмена</button>
                <button class="modal-btn confirm-btn" id="confirmDelete">Удалить</button>
            </div>
        </div>
    </div>

    <div class="input-modal" id="inputModal">
        <div class="input-modal-content">
            <div class="input-modal-title">Новая категория</div>
            <input type="text" class="input-field" id="newCategoryInput" placeholder="Введите название" autocomplete="off">
            
            <!-- Загрузка фонового изображения -->
            <div class="upload-section">
                <label class="upload-label">Фоновое изображение:</label>
                <div class="upload-preview" id="backgroundPreview">
                    <span class="upload-placeholder">Выберите изображение</span>
                </div>
                <input type="file" id="backgroundInput" accept="image/*" style="display: none;">
                <div class="upload-actions">
                <button class="upload-btn" id="backgroundBtn">Выбрать фон</button>
                    <button class="clear-upload-btn" id="clearBackgroundBtn" title="Очистить фон">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
            </div>

            <!-- Загрузка иконки -->
            <div class="upload-section">
                <label class="upload-label">Иконка категории:</label>
                <div class="upload-preview icon-preview" id="iconPreview">
                    <span class="upload-placeholder">Выберите иконку</span>
                </div>
                <input type="file" id="iconInput" accept="image/*" style="display: none;">
                <div class="upload-actions">
                <button class="upload-btn" id="iconBtn">Выбрать иконку</button>
                    <button class="clear-upload-btn" id="clearIconBtn" title="Очистить иконку">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>
            <div class="input-modal-buttons">
                <button class="modal-btn cancel-btn" id="cancelAdd">Отмена</button>
                <button class="modal-btn confirm-btn" id="confirmAdd">Создать</button>
            </div>
        </div>
    </div>

    <script>
        // Класс для работы с категориями через API
        class CategoryStorage {
            constructor() {
                this.apiUrl = '/api/categories';
                this.usageKey = 'categoryUsageCount'; // Для отслеживания частоты использования
            }

            // Получить все категории с сервера
            async getAll() {
                try {
                    const response = await fetch(this.apiUrl);
                    if (!response.ok) {
                        throw new Error('Ошибка загрузки категорий');
                    }
                    const categories = await response.json();
                    
                    // Преобразуем в объекты с дополнительными данными
                    const usageCounts = this.getUsageCounts();
                    return categories.map(cat => {
                        // Поддержка старого формата (строки) и нового (объекты)
                        const name = typeof cat === 'string' ? cat : cat.name;
                        return {
                            name: name,
                            background: typeof cat === 'object' ? cat.background : null,
                            icon: typeof cat === 'object' ? cat.icon : null,
                            usageCount: usageCounts[name] || 0
                        };
                    }).sort((a, b) => b.usageCount - a.usageCount); // Сортируем по частоте использования
                } catch (error) {
                    console.error('Ошибка загрузки категорий:', error);
                    return [];
                }
            }

            // Получить счетчики использования из localStorage
            getUsageCounts() {
                const counts = localStorage.getItem(this.usageKey);
                return counts ? JSON.parse(counts) : {};
            }

            // Сохранить счетчики использования
            saveUsageCounts(counts) {
                localStorage.setItem(this.usageKey, JSON.stringify(counts));
            }

            // Увеличить счетчик использования категории
            incrementUsage(categoryName) {
                const counts = this.getUsageCounts();
                counts[categoryName] = (counts[categoryName] || 0) + 1;
                this.saveUsageCounts(counts);
            }

            // Добавить новую категорию
            async add(categoryData) {
                try {
                    // categoryData может быть строкой (старый формат) или объектом (новый формат)
                    const payload = typeof categoryData === 'string' 
                        ? { name: categoryData }
                        : categoryData;

                    const response = await fetch(this.apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        return { success: false, message: data.error || 'Ошибка при добавлении категории' };
                    }
                    
                    return { success: true, category: data.category };
                } catch (error) {
                    console.error('Ошибка добавления категории:', error);
                    return { success: false, message: 'Ошибка соединения с сервером' };
                }
            }

            // Удалить категорию
            async remove(categoryName) {
                try {
                    const response = await fetch(`${this.apiUrl}/${encodeURIComponent(categoryName)}`, {
                        method: 'DELETE'
                    });
                    
                    if (!response.ok) {
                        throw new Error('Ошибка удаления категории');
                    }
                    
                    const data = await response.json();
                    
                    // Удаляем из счетчиков использования
                    const counts = this.getUsageCounts();
                    delete counts[categoryName];
                    this.saveUsageCounts(counts);
                    
                    return data.categories;
                } catch (error) {
                    console.error('Ошибка удаления категории:', error);
                    return [];
                }
            }

            // Обновить категорию
            async update(oldName, categoryData) {
                try {
                    const payload = typeof categoryData === 'string' 
                        ? { name: categoryData }
                        : categoryData;

                    const response = await fetch(`${this.apiUrl}/${encodeURIComponent(oldName)}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        return { success: false, message: data.error || 'Ошибка при обновлении категории' };
                    }
                    
                    return { success: true, category: data.category };
                } catch (error) {
                    console.error('Ошибка обновления категории:', error);
                    return { success: false, message: 'Ошибка соединения с сервером' };
                }
            }
        }

        // Элементы DOM
        const menuButton = document.getElementById('menuButton');
        const sidebar = document.getElementById('sidebar');
        const categoryList = document.getElementById('categoryList');
        const sidebarAddBtn = document.getElementById('sidebarAddBtn');
        const confirmModal = document.getElementById('confirmModal');
        const inputModal = document.getElementById('inputModal');
        const cancelDelete = document.getElementById('cancelDelete');
        const confirmDelete = document.getElementById('confirmDelete');
        const cancelAdd = document.getElementById('cancelAdd');
        const confirmAdd = document.getElementById('confirmAdd');
        const newCategoryInput = document.getElementById('newCategoryInput');
        const errorMessage = document.getElementById('error-message');

        // Элементы загрузки изображений
        const backgroundInput = document.getElementById('backgroundInput');
        const backgroundBtn = document.getElementById('backgroundBtn');
        const backgroundPreview = document.getElementById('backgroundPreview');
        const clearBackgroundBtn = document.getElementById('clearBackgroundBtn');
        const iconInput = document.getElementById('iconInput');
        const iconBtn = document.getElementById('iconBtn');
        const iconPreview = document.getElementById('iconPreview');
        const clearIconBtn = document.getElementById('clearIconBtn');

        // Переменные для хранения выбранных изображений
        let selectedBackground = null;
        let selectedIcon = null;

        // Плитки
        const tiles = [
            document.getElementById('tile1'),
            document.getElementById('tile2'),
            document.getElementById('tile3'),
            document.getElementById('tile4'),
            document.getElementById('tile5')
        ];

        // Инициализация хранилища
        const storage = new CategoryStorage();
        let currentCategoryToDelete = null;
        let currentCategoryToEdit = null;
        let isEditMode = false;

        // Функция отображения категорий
        async function renderCategories() {
            categoryList.innerHTML = '<li style="color: #666; padding: 10px;">Загрузка...</li>';
            const categories = await storage.getAll();
            
            categoryList.innerHTML = '';
            
            if (categories.length === 0) {
                categoryList.innerHTML = '<li style="color: #666; padding: 10px;">Нет категорий</li>';
                updateTiles([]);
                return;
            }
            
            categories.forEach(category => {
                const li = document.createElement('li');
                li.setAttribute('data-name', category.name);
                li.innerHTML = `
                    <span class="category-name">${category.name}</span>
                    <div class="category-actions">
                        <button class="edit-btn" title="Редактировать">
                            <span class="material-symbols-outlined">edit</span>
                        </button>
                        <button class="delete-btn" title="Удалить">×</button>
                    </div>
                `;
                
                // Добавляем обработчик клика на категорию (не на кнопки действий)
                li.addEventListener('click', function(e) {
                    const target = e.target;
                    const isActionButton = target.classList.contains('delete-btn') || 
                                          target.classList.contains('edit-btn') ||
                                          target.classList.contains('material-symbols-outlined') ||
                                          target.closest('.category-actions');
                    
                    if (!isActionButton) {
                        selectCategoryAndNavigate(category.name);
                    }
                });
                
                categoryList.appendChild(li);
            });
            
            // Обновляем плитки
            updateTiles(categories);
        }

        // Функция обновления плиток
        function updateTiles(categories) {
            // Ограничиваем количество категорий до 5
            const limitedCategories = categories.slice(0, 5);
            
            // Обновляем каждую плитку
            for (let i = 0; i < tiles.length; i++) {
                const tile = tiles[i];
                const label = tile.querySelector('.tile-label');
                
                if (i < limitedCategories.length) {
                    // Есть категория для этой плитки
                    const category = limitedCategories[i];
                    label.textContent = category.name;
                    // Добавляем класс для визуального различия
                    tile.classList.add('has-category');
                    
                    // Устанавливаем фон, если есть
                    if (category.background) {
                        tile.style.backgroundImage = `url(${category.background})`;
                        tile.style.backgroundSize = 'cover';
                        tile.style.backgroundPosition = 'center';
                        tile.style.backgroundRepeat = 'no-repeat';
                        tile.style.border = 'none'; // Убираем border при наличии фона
                    } else {
                        tile.style.backgroundImage = '';
                        tile.style.backgroundRepeat = '';
                        tile.style.border = ''; // Возвращаем border если нет фона
                    }
                    
                    // Добавляем иконку, если есть
                    let iconElement = tile.querySelector('.tile-icon');
                    if (category.icon) {
                        if (!iconElement) {
                            iconElement = document.createElement('div');
                            iconElement.className = 'tile-icon';
                            tile.insertBefore(iconElement, label);
                        }
                        iconElement.style.backgroundImage = `url(${category.icon})`;
                    } else if (iconElement) {
                        iconElement.remove();
                    }
                    
                    // Удаляем старые обработчики и добавляем новый
                    tile.onclick = function() {
                        selectCategoryAndNavigate(category.name);
                    };
                } else {
                    // Нет категории для этой плитки
                    label.textContent = `Плитка ${i + 1}`;
                    tile.classList.remove('has-category');
                    tile.style.backgroundImage = '';
                    tile.style.backgroundRepeat = '';
                    tile.style.border = '';
                    const iconElement = tile.querySelector('.tile-icon');
                    if (iconElement) iconElement.remove();
                    tile.onclick = null;
                }
            }
        }

        // Обработчик клика по кнопке меню
        menuButton.addEventListener('click', function() {
            sidebar.classList.toggle('active');
        });

        // Обработчик клика по кнопке добавления категории в сайдбаре
        sidebarAddBtn.addEventListener('click', function() {
            // Режим создания
            isEditMode = false;
            currentCategoryToEdit = null;
            
            // Сбрасываем форму
            document.querySelector('.input-modal-title').textContent = 'Новая категория';
            newCategoryInput.value = '';
            newCategoryInput.disabled = false;
            confirmAdd.textContent = 'Создать';
            
            // Сбрасываем загруженные изображения
            selectedBackground = null;
            selectedIcon = null;
            backgroundPreview.style.backgroundImage = '';
            backgroundPreview.classList.remove('has-image');
            iconPreview.style.backgroundImage = '';
            iconPreview.classList.remove('has-image');
            
            inputModal.classList.add('active');
            newCategoryInput.focus();
            errorMessage.style.display = 'none';
        });

        // Обработчики загрузки фона
        backgroundBtn.addEventListener('click', function() {
            backgroundInput.click();
        });

        backgroundInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedBackground = event.target.result;
                    backgroundPreview.style.backgroundImage = `url(${event.target.result})`;
                    backgroundPreview.classList.add('has-image');
                };
                reader.readAsDataURL(file);
            }
        });

        // Обработчики загрузки иконки
        iconBtn.addEventListener('click', function() {
            iconInput.click();
        });

        iconInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedIcon = event.target.result;
                    iconPreview.style.backgroundImage = `url(${event.target.result})`;
                    iconPreview.classList.add('has-image');
                };
                reader.readAsDataURL(file);
            }
        });

        // Обработчики кнопок очистки
        clearBackgroundBtn.addEventListener('click', function() {
            selectedBackground = null;
            backgroundPreview.style.backgroundImage = '';
            backgroundPreview.classList.remove('has-image');
            backgroundInput.value = '';
        });

        clearIconBtn.addEventListener('click', function() {
            selectedIcon = null;
            iconPreview.style.backgroundImage = '';
            iconPreview.classList.remove('has-image');
            iconInput.value = '';
        });

        // Обработчик клика по кнопке отмены добавления/редактирования
        cancelAdd.addEventListener('click', function() {
            inputModal.classList.remove('active');
            newCategoryInput.value = '';
            newCategoryInput.disabled = false;
            errorMessage.style.display = 'none';
            isEditMode = false;
            currentCategoryToEdit = null;
            document.querySelector('.input-modal-title').textContent = 'Новая категория';
            confirmAdd.textContent = 'Создать';
        });

        // Обработчик клика по кнопке подтверждения добавления/редактирования
        confirmAdd.addEventListener('click', async function() {
            const categoryName = newCategoryInput.value.trim();
            if (categoryName) {
                // Показываем процесс загрузки
                confirmAdd.disabled = true;
                const originalText = confirmAdd.textContent;
                confirmAdd.textContent = isEditMode ? 'Сохранение...' : 'Добавление...';
                
                const categoryData = {
                    name: categoryName,
                    background: selectedBackground,
                    icon: selectedIcon
                };
                
                let result;
                if (isEditMode) {
                    // Режим редактирования
                    result = await storage.update(currentCategoryToEdit, categoryData);
                } else {
                    // Режим создания
                    result = await storage.add(categoryData);
                }
                
                // Возвращаем кнопку в исходное состояние
                confirmAdd.disabled = false;
                confirmAdd.textContent = originalText;
                
                if (result.success) {
                    await renderCategories();
                    inputModal.classList.remove('active');
                    newCategoryInput.value = '';
                    newCategoryInput.disabled = false;
                    errorMessage.style.display = 'none';
                    isEditMode = false;
                    currentCategoryToEdit = null;
                    // Сбрасываем изображения
                    selectedBackground = null;
                    selectedIcon = null;
                    backgroundPreview.style.backgroundImage = '';
                    backgroundPreview.classList.remove('has-image');
                    iconPreview.style.backgroundImage = '';
                    iconPreview.classList.remove('has-image');
                } else {
                    errorMessage.textContent = result.message;
                    errorMessage.style.display = 'block';
                }
            }
        });

        // Обработчики для кнопок удаления и редактирования категорий
        document.addEventListener('click', function(e) {
            // Проверяем клик по кнопке удаления
            if (e.target.classList.contains('delete-btn')) {
                e.stopPropagation();
                const categoryName = e.target.closest('li').getAttribute('data-name');
                currentCategoryToDelete = categoryName;
                confirmModal.classList.add('active');
            }
            
            // Проверяем клик по кнопке редактирования или её иконке
            const editBtn = e.target.closest('.edit-btn');
            if (editBtn) {
                e.stopPropagation();
                const categoryName = editBtn.closest('li').getAttribute('data-name');
                openEditModal(categoryName);
            }
        });

        // Открыть модальное окно редактирования
        async function openEditModal(categoryName) {
            isEditMode = true;
            currentCategoryToEdit = categoryName;
            
            // Загружаем данные категории
            const categories = await storage.getAll();
            const category = categories.find(cat => cat.name === categoryName);
            
            if (!category) return;
            
            // Заполняем форму
            document.querySelector('.input-modal-title').textContent = 'Редактировать категорию';
            newCategoryInput.value = category.name;
            newCategoryInput.disabled = true; // Запрещаем изменение имени
            
            // Загружаем фон
            if (category.background) {
                selectedBackground = category.background;
                backgroundPreview.style.backgroundImage = `url(${category.background})`;
                backgroundPreview.classList.add('has-image');
            }
            
            // Загружаем иконку
            if (category.icon) {
                selectedIcon = category.icon;
                iconPreview.style.backgroundImage = `url(${category.icon})`;
                iconPreview.classList.add('has-image');
            }
            
            // Меняем текст кнопки
            confirmAdd.textContent = 'Сохранить';
            
            inputModal.classList.add('active');
            errorMessage.style.display = 'none';
        }

        // Обработчик клика по кнопке отмены удаления
        cancelDelete.addEventListener('click', function() {
            confirmModal.classList.remove('active');
            currentCategoryToDelete = null;
        });

        // Обработчик клика по кнопке подтверждения удаления
        confirmDelete.addEventListener('click', async function() {
            if (currentCategoryToDelete !== null) {
                // Показываем процесс загрузки
                confirmDelete.disabled = true;
                confirmDelete.textContent = 'Удаление...';
                
                await storage.remove(currentCategoryToDelete);
                await renderCategories();
                
                // Возвращаем кнопку в исходное состояние
                confirmDelete.disabled = false;
                confirmDelete.textContent = 'Удалить';
                
                confirmModal.classList.remove('active');
                currentCategoryToDelete = null;
            }
        });

        // Закрытие модальных окон при клике вне их области
        window.addEventListener('click', function(e) {
            if (e.target === confirmModal) {
                confirmModal.classList.remove('active');
                currentCategoryToDelete = null;
            }
            if (e.target === inputModal) {
                inputModal.classList.remove('active');
                newCategoryInput.value = '';
                errorMessage.style.display = 'none';
            }
        });

        // Валидация ввода при изменении поля
        newCategoryInput.addEventListener('input', function() {
            errorMessage.style.display = 'none';
        });

        // Добавление по нажатию Enter
        newCategoryInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                confirmAdd.click();
            }
        });

        // Функция выбора категории и перехода к списку
        function selectCategoryAndNavigate(categoryName) {
            // Увеличиваем счетчик использования категории
            storage.incrementUsage(categoryName);
            
            // Получаем ранее сохраненные фильтры (если есть)
            const pendingFiltersStr = localStorage.getItem('pendingFilters');
            console.log('📖 [index2.html] Сырые данные из localStorage:', pendingFiltersStr);
            
            const pendingFilters = pendingFiltersStr ? JSON.parse(pendingFiltersStr) : {};
            console.log('📖 [index2.html] Распарсенные фильтры:', pendingFilters);
            
            // Добавляем выбранную категорию
            pendingFilters.category = categoryName;
            pendingFilters.timestamp = Date.now();
            
            // Сохраняем обновленные фильтры
            const updatedFiltersStr = JSON.stringify(pendingFilters);
            localStorage.setItem('pendingFilters', updatedFiltersStr);
            console.log('💾 [index2.html] Обновленные фильтры:', pendingFilters);
            console.log('💾 [index2.html] Строка для сохранения:', updatedFiltersStr);
            
            // Проверяем что сохранилось
            const checkSaved = localStorage.getItem('pendingFilters');
            console.log('🔍 [index2.html] Проверка сохранения:', checkSaved);
            
            // Переходим на страницу списка фильмов
            window.location.href = 'list_sorting.html';
        }

        // Переход к списку всех фильмов (с сохранением фильтров, если они есть)
        function goToList() {
            const pendingFilters = JSON.parse(localStorage.getItem('pendingFilters') || '{}');
            if (Object.keys(pendingFilters).length > 1) { // timestamp всегда есть
                console.log('📋 [index2.html] Переход к списку с фильтрами:', pendingFilters);
            } else {
                console.log('📋 [index2.html] Переход к списку без фильтров');
            }
            window.location.href = 'list_sorting.html';
        }

        // Кнопка назад - возврат в index1.html без очистки фильтров
        function goBack() {
            // Сохраняем только contentType и watchStatus, убираем category
            const pendingFiltersStr = localStorage.getItem('pendingFilters');
            if (pendingFiltersStr) {
                const pendingFilters = JSON.parse(pendingFiltersStr);
                // Убираем категорию, но сохраняем тип контента и статус просмотра
                if (pendingFilters.category) {
                    delete pendingFilters.category;
                    localStorage.setItem('pendingFilters', JSON.stringify(pendingFilters));
                    console.log('🔙 [index2.html] Возврат назад, категория удалена из фильтров');
                }
            }
            window.location.href = 'index.html';
        }

        // Проверка фильтров при загрузке страницы
        function checkPendingFiltersOnLoad() {
            const pendingFiltersStr = localStorage.getItem('pendingFilters');
            if (pendingFiltersStr) {
                const pendingFilters = JSON.parse(pendingFiltersStr);
                console.log('🎯 [index2.html ЗАГРУЗКА] Найдены фильтры из предыдущей страницы:', pendingFilters);
                
                if (pendingFilters.contentType) {
                    console.log('  → Тип контента:', pendingFilters.contentType);
                }
                if (pendingFilters.watchStatus) {
                    console.log('  → Статус просмотра:', pendingFilters.watchStatus);
                }
            } else {
                console.log('🎯 [index2.html ЗАГРУЗКА] Фильтры не найдены');
            }
        }

        // Инициализация при загрузке страницы
        checkPendingFiltersOnLoad();
        renderCategories();
    </script>
    <script src="theme-manager.js"></script>
</body>
</html>
